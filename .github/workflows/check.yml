name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # Includes the eval scorers against canned outputs; no model is called.
      - run: pnpm test:coverage
      - run: pnpm build
  # Model evals (pnpm eval:resume|job|prep, eval:live) run by hand before
  # releases; never expose paid API secrets to PR code.
